let quiz=[],index=0,score=0,wrong=[],answered=false;
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){quiz=shuffle(questions);index=0;score=0;wrong=[];$('quizScreen').classList.remove('hidden');$('finalScreen').classList.add('hidden');show()}

function finish(){$('quizScreen').classList.add('hidden');$('finalScreen').classList.remove('hidden');const pct=score/quiz.length*100;let msg=pct===100?'🌟 PERFECT!\n完璧です！':pct>=90?'🔥 EXCELLENT!\nとてもよくできました！':pct>=80?'👏 GREAT JOB!\nよくできました！':pct>=60?'👍 GOOD JOB!\n頑張っています！':'📚 KEEP PRACTICING!\nもう少し練習してみましょう！';$('finalScreen').innerHTML=`<h2>🏆 QUIZ COMPLETE!</h2><div class="bigscore">${score} / ${quiz.length}</div><div>Accuracy: ${pct.toFixed(1)}%</div><h3>${msg.replace('\n','<br>')}</h3><div>Wrong answers: ${wrong.length}</div><button onclick="review()">📚 Review Wrong Answers</button><button onclick="start()">🔄 Restart Quiz</button>`}
